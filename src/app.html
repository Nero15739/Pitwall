<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <title>Pit Wall</title>
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('pitwall-theme'); } catch (e) {}
        var os = matchMedia('(prefers-color-scheme: dark)');
        document.documentElement.dataset.theme = saved || (os.matches ? 'dark' : 'light');
        os.addEventListener('change', function (e) {
          var s = null; try { s = localStorage.getItem('pitwall-theme'); } catch (x) {}
          if (!s) document.documentElement.dataset.theme = e.matches ? 'dark' : 'light';
        });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
